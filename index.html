<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme !== 'light' && theme !== 'dark') {
        theme = 'dark';
      }
      document.documentElement.className = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#060911' : '#f4f7fc');
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#060911" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CMFI Replay" />
  <link rel="icon" type="image/svg+xml" href="/cmfireplay.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Open Graph Meta Tags (fallback — crawlers on media pages get per-media tags from /api/og via vercel.json) -->
  <!-- NOTE: og:image must be an absolute URL, crawlers ignore relative paths -->
  <meta property="og:title" content="CMFI Replay" />
  <meta property="og:description"
    content="Plateforme de replay chrétienne — Documentaires, productions et podcasts." />
  <meta property="og:image" content="https://cmfi-replay.com/og-fallback.jpg" />
  <meta property="og:image:secure_url" content="https://cmfi-replay.com/og-fallback.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:alt" content="CMFI Replay" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://cmfi-replay.com" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CMFI Replay" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CMFI Replay" />
  <meta name="twitter:description"
    content="Plateforme de replay chrétienne — Documentaires, productions et podcasts." />
  <meta name="twitter:image" content="https://cmfi-replay.com/og-fallback.jpg" />
  <meta name="twitter:image:alt" content="CMFI Replay" />

  <!-- Description pour SEO -->
  <meta name="description" content="Plateforme de replay chrétienne — Documentaires, productions et podcasts." />

  <title>CMFI Replay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
  <style>
    /* For Webkit-based browsers (Chrome, Safari) */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    /* For IE, Edge and Firefox */
    .scrollbar-hide {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fadeIn {
      animation: fadeIn 0.75s ease-in-out;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>

<body class="bg-[#f4f7fc] dark:bg-[#060911] text-slate-900 dark:text-slate-50 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
